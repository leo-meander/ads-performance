# Every 2 days, 02:00 UTC — refresh the competitor ad ledger behind /ad-research.
#
# Cadence is a cost decision. The Ad Library provider bills per ad returned and
# an ad's run length barely moves overnight, so a two-day sweep buys the same
# longevity signal for a fraction of the spend. Longevity is measured from
# Meta's own start date, so a skipped day never puts a hole in the number.
#
# The endpoint also runs the AI breakdown batch on whatever newly crossed the
# long-running bar; pass breakdown=false to crawl without spending on models.
name: Cron — Spy Ads competitor crawl (every 2 days)

on:
  schedule:
    - cron: "0 2 */2 * *"
  workflow_dispatch:

env:
  BACKEND_URL: https://ads-performance-fuls.zeabur.app
  ENDPOINT: spy-ads-crawl

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/internal/tasks/spy-ads-crawl
        env:
          INTERNAL_TASK_SECRET: ${{ secrets.INTERNAL_TASK_SECRET }}
        run: |
          set -euo pipefail
          echo "Triggering endpoint: $ENDPOINT"
          HTTP_CODE=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            -X POST \
            -H "X-Internal-Secret: $INTERNAL_TASK_SECRET" \
            "$BACKEND_URL/api/internal/tasks/$ENDPOINT")
          echo "HTTP $HTTP_CODE"
          cat /tmp/body.txt || true
          echo
          if [ "$HTTP_CODE" != "202" ]; then
            echo "::error::endpoint $ENDPOINT returned HTTP $HTTP_CODE"
            exit 1
          fi
