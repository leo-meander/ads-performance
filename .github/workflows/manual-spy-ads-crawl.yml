# Manual only — refresh the competitor ad ledger behind /ad-research.
#
# Deliberately NOT on a schedule. The Ad Library provider bills per ad returned
# and re-crawling only sharpens our own first/last-seen evidence: the headline
# run length comes from Meta's own start date and does not care how often we
# look. Competitor research is something Mason does in bursts, so paying for a
# sweep every other day would buy resolution nobody reads.
#
# The normal way to run this is the "Crawl now" button on /ad-research, which
# walks competitors one at a time and shows a live roll call. This workflow is
# the fallback for crawling without opening the app.
#
# Because nothing runs automatically, the ledger goes stale between crawls —
# the Radar tab says how stale, and ads that stopped since the last crawl keep
# their last-confirmed run length rather than growing.
name: Manual — Spy Ads competitor crawl

on:
  workflow_dispatch:

env:
  BACKEND_URL: https://ads-performance-fuls.zeabur.app
  ENDPOINT: spy-ads-crawl

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/internal/tasks/spy-ads-crawl
        env:
          INTERNAL_TASK_SECRET: ${{ secrets.INTERNAL_TASK_SECRET }}
        run: |
          set -euo pipefail
          echo "Triggering endpoint: $ENDPOINT"
          HTTP_CODE=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            -X POST \
            -H "X-Internal-Secret: $INTERNAL_TASK_SECRET" \
            "$BACKEND_URL/api/internal/tasks/$ENDPOINT")
          echo "HTTP $HTTP_CODE"
          cat /tmp/body.txt || true
          echo
          if [ "$HTTP_CODE" != "202" ]; then
            echo "::error::endpoint $ENDPOINT returned HTTP $HTTP_CODE"
            exit 1
          fi
